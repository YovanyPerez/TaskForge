{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password changed" %} — TaskForge{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <section class="tf-card tf-card-accent-green" aria-labelledby="reset-complete-heading">
      <h1 id="reset-complete-heading" class="h3">{% trans "Password changed" %}</h1>
      <p class="tf-muted small">{% trans "Your password has been set. You can now log in with your new password." %}</p>
      <a class="tf-btn tf-btn-primary w-100 mt-3" href="{% url 'users:login' %}">{% trans "Log in" %}</a>
    </section>
  </div>
</div>
{% endblock %}
