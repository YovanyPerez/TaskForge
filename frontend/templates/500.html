{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Something went wrong" %} — TaskForge</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f4f1ea;
      color: #111111;
      padding: 32px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #fffdf7;
      border: 3px solid #111111;
      box-shadow: 6px 6px 0 #111111;
      padding: 32px;
      text-align: center;
    }
    .logo { font-weight: 800; letter-spacing: 0.12em; font-size: 14px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #5c564a; font-size: 14px; line-height: 1.55; margin: 8px 0; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 16px;
      background: #ffd43b;
      color: #111111;
      font-weight: 800;
      text-decoration: none;
      border: 2px solid #111111;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TASKFORGE</div>
    <h1>{% trans "Something went wrong" %}</h1>
    <p>{% trans "The server had a problem. Please try again in a moment." %}</p>
    <a href="/">{% trans "Back to the dashboard" %}</a>
  </div>
</body>
</html>
